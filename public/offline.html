<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#24735a" />
    <title>ออฟไลน์ · WorkNest</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: #f7f7f5;
        color: #1c1917;
        font-family: "IBM Plex Sans Thai", system-ui, sans-serif;
        text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { margin: 0 0 24px; color: #57534e; line-height: 1.6; }
      button {
        font: inherit;
        border: 0;
        border-radius: 8px;
        padding: 10px 20px;
        background: #24735a;
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
      <p>WorkNest ต้องใช้อินเทอร์เน็ตเพื่อโหลดข้อมูลล่าสุด<br />ลองเชื่อมต่อใหม่แล้วกดโหลดอีกครั้ง</p>
      <button onclick="location.reload()">ลองอีกครั้ง</button>
    </main>
  </body>
</html>
